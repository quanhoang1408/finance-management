<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sổ Tiền">
<title>Sổ Tiền — Chia tiền nhóm & chi tiêu cá nhân</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2288%22>💵</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230E6B47%22/><text x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22>💵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F1E9;      /* nền giấy */
  --card:#FFFFFF;
  --ink:#182720;        /* mực */
  --muted:#71806F;
  --line:#E4E1D2;
  --green:#0E6B47;      /* xanh tờ 500k */
  --green-soft:#E0EDE4;
  --red:#C14A2D;        /* gạch - khoản nợ/chi */
  --red-soft:#F7E7E0;
  --amber:#A8730F;
  --r:18px;
  --shadow:0 1px 2px rgba(24,39,32,.05), 0 10px 28px rgba(24,39,32,.07);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.45;
}
#app{max-width:520px;margin:0 auto;padding:18px 16px 110px;min-height:100vh}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}

/* ===== chữ ===== */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px}
.h2{font-size:15px;font-weight:700;margin:0 0 6px}
.sub{font-size:12.5px;color:var(--muted)}
.money{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.money .d{font-size:.72em;font-weight:700;margin-left:2px;opacity:.75}
.big{font-size:34px;line-height:1.1}
.pos{color:var(--green)} .neg{color:var(--red)} .zero{color:var(--muted)}

/* ===== thẻ & hàng sổ ===== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border:0;background:none;width:100%;text-align:left;font-size:15px;cursor:pointer}
.row + .row{border-top:1px solid var(--line)}
.leader{flex:1;min-width:14px;border-bottom:2px dotted var(--line);margin:0 2px;transform:translateY(4px)}
.avatar{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.av-g{background:var(--green-soft);color:var(--green)}
.name{font-weight:600;min-width:0}
.name .sub{font-weight:400;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowmain{min-width:0;flex-shrink:1}

/* ===== nút ===== */
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;border:0;border-radius:14px;padding:14px;font-size:15.5px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}
.btn-ghost{background:var(--green-soft);color:var(--green)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-line{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.btn-sm{width:auto;padding:9px 14px;font-size:13.5px;border-radius:11px}
.iconbtn{border:0;background:var(--green-soft);color:var(--green);width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer;flex-shrink:0}
.iconbtn.red{background:var(--red-soft);color:var(--red)}
.link{background:none;border:0;color:var(--green);font-weight:700;font-size:13.5px;cursor:pointer;padding:4px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* ===== form ===== */
.field{margin-bottom:13px}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.in{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.in:focus{border-color:var(--green)}
select.in{appearance:none;background:#fff url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8"><path d="M1 1l5 5 5-5" stroke="%2371806F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>') no-repeat right 13px center}
.seg{display:flex;background:var(--paper);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(24,39,32,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.emorow{display:flex;gap:6px;overflow-x:auto;padding:2px}
.emo{border:1.5px solid var(--line);background:#fff;border-radius:12px;width:44px;height:44px;font-size:21px;cursor:pointer;flex-shrink:0}
.emo.on{border-color:var(--green);background:var(--green-soft)}

/* hàng chia tiền */
.sprow{display:flex;align-items:center;gap:10px;padding:9px 0}
.sprow + .sprow{border-top:1px dashed var(--line)}
.sprow input[type=checkbox]{width:21px;height:21px;accent-color:var(--green);flex-shrink:0}
.sprow .amt{width:118px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;background:#fff}
.sprow .amt:disabled{background:var(--paper);color:var(--muted);border-style:dashed}
.sumline{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:2px solid var(--line);font-size:13.5px;font-weight:700}
.sum-ok{color:var(--green)} .sum-bad{color:var(--red)}
.mybox{background:var(--green-soft);border-radius:13px;padding:12px;margin-top:12px}
.mybox label{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;font-weight:600;cursor:pointer}
.mybox input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex-shrink:0;margin-top:1px}

/* ===== sheet (modal trượt) ===== */
.mask{position:fixed;inset:0;background:rgba(20,30,24,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.9,.3,1)}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheethead .h1{margin:0;font-size:20px}
.x{border:0;background:var(--card);width:32px;height:32px;border-radius:10px;font-size:15px;color:var(--muted);cursor:pointer;box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ===== tab bar ===== */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
.tabin{pointer-events:auto;display:flex;width:100%;max-width:520px;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;min-width:0;border:0;background:none;padding:9px 2px 7px;text-align:center;cursor:pointer;color:var(--muted)}
.tab .ic{font-size:21px;display:block;filter:grayscale(1);opacity:.55}
.tab .tl{font-size:10px;font-weight:700;margin-top:2px;display:block}
.tab.on{color:var(--green)}
.tab.on .ic{filter:none;opacity:1}

/* ===== linh tinh ===== */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:0;background:var(--card);box-shadow:var(--shadow);width:36px;height:36px;border-radius:12px;font-size:16px;cursor:pointer;color:var(--ink);flex-shrink:0}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthnav .h1{margin:0;font-size:21px}
.mbtn{border:0;background:var(--card);box-shadow:var(--shadow);width:36px;height:36px;border-radius:12px;font-size:15px;cursor:pointer}
.dayhead{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 2px;letter-spacing:.05em;text-transform:uppercase}
.donutwrap{display:flex;gap:16px;align-items:center}
.donut{width:108px;height:108px;border-radius:50%;flex-shrink:0;position:relative}
.donut::after{content:"";position:absolute;inset:26px;background:var(--card);border-radius:50%}
.legend{flex:1;min-width:0}
.lrow{display:flex;align-items:center;gap:8px;padding:5.5px 0;font-size:13.5px}
.dot{width:10px;height:10px;border-radius:4px;flex-shrink:0}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
.pbar.dark{background:rgba(255,255,255,.18)}
.pfill{height:100%;border-radius:99px;transition:width .35s ease}
.budrow{padding:11px 0}
.budrow + .budrow{border-top:1px solid var(--line)}
.budtop{display:flex;align-items:center;gap:9px;font-size:14px}
.splitstat{display:flex;gap:18px;margin-top:12px}
.splitstat > div{flex:1}
.qchip{border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:9px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:7px}
.qchip:active{transform:scale(.96)}
.qchip b{font-variant-numeric:tabular-nums;color:var(--green)}
textarea.in{min-height:92px;resize:vertical;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:38px 14px}
.empty .big-ic{font-size:44px;display:block;margin-bottom:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:13px;font-size:14px;font-weight:600;z-index:100;box-shadow:var(--shadow);max-width:88vw;text-align:center;animation:up .2s ease}
.toast.err{background:var(--red)}
.spinwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px;color:var(--muted)}
.spin{width:34px;height:34px;border:3.5px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hero{display:flex;flex-direction:column;justify-content:center;min-height:78vh;max-width:400px;margin:0 auto}
.hero .logo{font-size:52px;margin-bottom:6px}
.note{font-size:12.5px;color:var(--muted);background:var(--card);border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.5}
.errbox{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 13px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.statgrid{display:flex;gap:10px}
.statgrid .card{flex:1;margin-bottom:0}
.caption-i{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="spinwrap"><div class="spin"></div><div>Đang mở sổ…</div></div></div>
<div id="tabbar"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   CẤU HÌNH SUPABASE (KHÔNG BẮT BUỘC SỬA)
   Cách 1 (khuyên dùng): để trống 2 dòng dưới — khi mở web lần đầu,
   app sẽ hiện màn hình cho bạn dán Project URL + API key, lưu ngay
   trên thiết bị. Nhờ vậy file này không chứa thông tin gì cả.
   Cách 2: dán thẳng 2 giá trị vào giữa 2 dấu "" bên dưới.
   ===================================================================== */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

const CFG_KEY = "sotien_cfg_v1";
const LASTCAT_KEY = "sotien_lastcat";
let sb = null;

const state = {
  session: null,
  members: [], groups: [], groupMembers: [],
  expenses: [], splits: [], settlements: [],
  categories: [], personal: [],
  incomes: [], budgets: [], quick: [], funds: [], fundTxns: [],
  ui: { tab: "tq", groupId: null, fundId: null, month: curMonth() }
};

/* ================= TIỆN ÍCH ================= */
const $ = s => document.querySelector(s);
const app = () => $("#app");
const NF = new Intl.NumberFormat("vi-VN");

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(n){ return `<span class="money">${NF.format(Math.round(n||0))}<span class="d">đ</span></span>`; }
function fmtPlain(n){ return NF.format(Math.round(n||0)) + " đ"; }
function parseMoney(str){ return Number(String(str||"").replace(/[^\d]/g, "")) || 0; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function curMonth(){ return todayStr().slice(0,7); }
function monthLabel(m){ const [y,mm]=m.split("-"); return `Tháng ${Number(mm)}/${y}`; }
function dmy(d){ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${dd}/${m}`; }
function dmyFull(d){ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; }
function dayLabel(d){
  const wd=["CN","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"][new Date(d+"T12:00:00").getDay()];
  return d===todayStr() ? `Hôm nay · ${dmy(d)}` : `${wd} · ${dmy(d)}`;
}
function initials(name){ return (name||"?").trim().charAt(0).toUpperCase(); }
const AV_COLORS = [["#E0EDE4","#0E6B47"],["#EAE4F4","#5B3F9E"],["#F7E7E0","#C14A2D"],["#E2EBF5","#2E5E93"],["#F4EDDC","#A8730F"],["#E4F1EF","#1F7A6C"],["#F5E3EC","#B0447E"]];
function avStyle(id){ const h=[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0); const [bg,fg]=AV_COLORS[h%AV_COLORS.length]; return `background:${bg};color:${fg}`; }
function moneyClass(n){ return n>0?"pos":(n<0?"neg":"zero"); }

function me(){ return state.members.find(m=>m.is_me) || null; }
function memberById(id){ return state.members.find(m=>m.id===id); }
function catById(id){ return state.categories.find(c=>c.id===id); }
function membersOf(gid){
  return state.groupMembers.filter(gm=>gm.group_id===gid)
    .map(gm=>memberById(gm.member_id)).filter(Boolean)
    .sort((a,b)=>a.name.localeCompare(b.name,"vi"));
}
function splitsOf(eid){ return state.splits.filter(s=>s.expense_id===eid); }
function groupExpenses(gid){ return state.expenses.filter(e=>e.group_id===gid); }

function equalSplit(total, n){
  if(n<=0) return [];
  const base=Math.floor(total/n), r=total-base*n;
  return Array.from({length:n},(_,i)=>base+(i<r?1:0));
}

/* bind ô nhập tiền: tự chèn dấu chấm ngăn cách */
function bindMoney(inp, oninput){
  const f=()=>{ const raw=parseMoney(inp.value); inp.dataset.raw=raw; inp.value=raw?NF.format(raw):""; if(oninput) oninput(raw); };
  inp.addEventListener("input", f);
  if(inp.value) f();
}
function getMoney(inp){ return Number(inp.dataset.raw || parseMoney(inp.value)); }

/* ================= TOAST / SHEET / HỎI ================= */
let toastTimer=null;
function toast(msg, isErr){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div");
  t.className="toast"+(isErr?" err":""); t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.remove(), 2600);
}

const sheets=[];
function sheetOpen(html){
  const mask=document.createElement("div");
  mask.className="mask";
  mask.innerHTML=`<div class="sheet"><div class="grip"></div>${html}</div>`;
  const close=()=>{ mask.remove(); const i=sheets.indexOf(api); if(i>-1) sheets.splice(i,1); };
  mask.addEventListener("click", e=>{ if(e.target===mask) close(); });
  document.body.appendChild(mask);
  const api={ el:mask, close };
  sheets.push(api);
  return api;
}
function closeAllSheets(){ [...sheets].forEach(s=>s.close()); }

function ask(msg, okLabel="Xoá"){
  return new Promise(res=>{
    const s=sheetOpen(`
      <div class="h1" style="font-size:19px">${esc(msg)}</div>
      <div class="btnrow" style="margin-top:16px">
        <button class="btn btn-ghost" id="ask-no">Huỷ</button>
        <button class="btn btn-danger" id="ask-yes">${esc(okLabel)}</button>
      </div>`);
    s.el.querySelector("#ask-no").onclick=()=>{ s.close(); res(false); };
    s.el.querySelector("#ask-yes").onclick=()=>{ s.close(); res(true); };
  });
}

/* hỏi 1–2 ô nhập, trả về object hoặc null */
function promptSheet(title, fields, okLabel="Lưu"){
  return new Promise(res=>{
    const inner=fields.map((f,i)=>`
      <div class="field"><label class="lbl">${esc(f.label)}</label>
      <input class="in" id="pf-${i}" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}" ${f.max?`maxlength="${f.max}"`:""}></div>`).join("");
    const s=sheetOpen(`
      <div class="sheethead"><div class="h1">${esc(title)}</div><button class="x" id="pf-x">✕</button></div>
      ${inner}
      <button class="btn" id="pf-ok" style="margin-top:4px">${esc(okLabel)}</button>`);
    s.el.querySelector("#pf-x").onclick=()=>{ s.close(); res(null); };
    s.el.querySelector("#pf-ok").onclick=()=>{
      const out={};
      fields.forEach((f,i)=>out[f.key]=s.el.querySelector(`#pf-${i}`).value.trim());
      s.close(); res(out);
    };
    setTimeout(()=>s.el.querySelector("#pf-0")?.focus(), 60);
  });
}

/* ================= KẾT NỐI & ĐĂNG NHẬP ================= */
function getCfg(){
  if(SUPABASE_URL && SUPABASE_ANON_KEY) return {url:SUPABASE_URL, key:SUPABASE_ANON_KEY, fromCode:true};
  try{ return JSON.parse(localStorage.getItem(CFG_KEY)||"null"); }catch(e){ return null; }
}

async function boot(){
  const cfg=getCfg();
  if(!cfg || !cfg.url || !cfg.key){ renderSetup(); return; }
  try{
    sb = supabase.createClient(cfg.url, cfg.key);
  }catch(e){ renderSetup("Không kết nối được — kiểm tra lại URL và key."); return; }
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ state.session=null; renderLogin(); } });
  const { data:{ session } } = await sb.auth.getSession();
  state.session=session;
  if(!session){ renderLogin(); return; }
  await afterLogin();
}

function renderSetup(err){
  $("#tabbar").innerHTML="";
  app().innerHTML=`
  <div class="hero">
    <div class="logo">💵</div>
    <div class="eyebrow">Lần đầu mở sổ</div>
    <h1 class="h1">Kết nối Supabase</h1>
    ${err?`<div class="errbox">${esc(err)}</div>`:""}
    <div class="field"><label class="lbl">Project URL</label>
      <input class="in" id="cfg-url" placeholder="https://xxxx.supabase.co" autocapitalize="off"></div>
    <div class="field"><label class="lbl">API key (publishable / anon public)</label>
      <input class="in" id="cfg-key" placeholder="sb_publishable_… hoặc eyJhbGciOi…" autocapitalize="off"></div>
    <button class="btn" onclick="doSetup()">Kết nối</button>
    <div class="note">Lấy 2 giá trị này trong Supabase → <b>Project Settings → API Keys</b>. Chúng chỉ được lưu trên thiết bị này và chỉ cần dán 1 lần cho mỗi thiết bị. Chi tiết xem file <b>huong-dan-deploy.md</b>.</div>
  </div>`;
}
function doSetup(){
  const url=$("#cfg-url").value.trim().replace(/\/+$/,"");
  const key=$("#cfg-key").value.trim();
  if(!/^https:\/\/.+supabase\.(co|in|com)/.test(url)) return toast("Project URL chưa đúng (dạng https://xxxx.supabase.co)", true);
  if(key.length<20) return toast("API key có vẻ chưa đúng", true);

/* ================= TÍNH SỐ DƯ =================
   pairNet(m) > 0  →  m đang nợ bạn
   pairNet(m) < 0  →  bạn đang nợ m                     */
function grossPair(mid, gid=null){
  const my=me(); if(!my) return 0;
  let net=0;
  for(const e of state.expenses){
    if(gid && e.group_id!==gid) continue;
    if(e.payer_id===my.id){
      const s=state.splits.find(x=>x.expense_id===e.id && x.member_id===mid);
      if(s) net+=s.amount;
    }else if(e.payer_id===mid){
      const s=state.splits.find(x=>x.expense_id===e.id && x.member_id===my.id);
      if(s) net-=s.amount;
    }
  }
  return net;
}
/* tác động của các lần trả nợ (âm = họ đã trả bớt cho bạn) */
function settleEffect(mid){
  let s=0;
  for(const st of state.settlements){
    if(st.member_id!==mid) continue;
    s += st.direction==="received" ? -st.amount : st.amount;
  }
  return s;
}
/* Trả nợ được ghi chung cho 1 người, nên khi hiện số trong từng nhóm
   ta phân bổ số đã trả về các nhóm theo tỷ lệ nợ — nhờ vậy vào nhóm
   cũng thấy số đã giảm, và tổng các nhóm luôn khớp với tab Tổng quan. */
function pairNet(mid, gid=null){
  /* Nếu hỏi theo nhóm cụ thể: trả về số phát sinh thô trong nhóm đó,
     KHÔNG trừ tiền trả nợ (trả nợ là global, không gắn với nhóm nào).
     Nếu hỏi tổng (gid=null): trừ hết tiền đã trả → đây là số thực bạn dùng. */
  return gid ? grossPair(mid, gid) : grossPair(mid) + settleEffect(mid);
}
function involvedIn(gid){
  const my=me(); const ids=new Set(membersOf(gid).map(m=>m.id));
  for(const e of groupExpenses(gid)){
    if(e.payer_id!==my.id) ids.add(e.payer_id);
    for(const s of splitsOf(e.id)) if(s.member_id!==my.id) ids.add(s.member_id);
  }
  return [...ids].map(memberById).filter(Boolean);
}
function hasActivity(mid){
  const my=me();
  return state.splits.some(s=>{
      if(s.member_id===mid){ const e=state.expenses.find(x=>x.id===s.expense_id); return e && e.payer_id===my.id; }
      if(s.member_id===my.id){ const e=state.expenses.find(x=>x.id===s.expense_id); return e && e.payer_id===mid; }
      return false;
    }) || state.settlements.some(s=>s.member_id===mid);
}

/* ---- chi tiết 1 người ---- */
function memberHistory(mid){
  const my=me(); const items=[];
  for(const e of state.expenses){
    const g=state.groups.find(x=>x.id===e.group_id);
    if(e.payer_id===my.id){
      const s=state.splits.find(x=>x.expense_id===e.id&&x.member_id===mid);
      if(s) items.push({date:e.expense_date, amt:s.amount, label:`${g?g.icon+" ":""}${e.description}`, sub:"bạn trả · họ nợ thêm"});
    }else if(e.payer_id===mid){
      const s=state.splits.find(x=>x.expense_id===e.id&&x.member_id===my.id);
      if(s) items.push({date:e.expense_date, amt:-s.amount, label:`${g?g.icon+" ":""}${e.description}`, sub:"họ trả · bạn nợ thêm"});
    }
  }
  for(const st of state.settlements){
    if(st.member_id!==mid) continue;
    if(st.direction==="received") items.push({date:st.settled_date, amt:-st.amount, label:"💸 Họ trả tiền cho bạn", sub:st.note||"trừ nợ", pay:true});
    else items.push({date:st.settled_date, amt:st.amount, label:"💸 Bạn trả tiền cho họ", sub:st.note||"trừ nợ bạn", pay:true});
  }
  return items.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}

  const net=pairNet(mid);

    ${net>0?`<button class="btn btn-ghost" id="ms-remind" style="margin-top:10px">💬 Soạn tin nhắc nợ</button>`:""}
    ${perGroup.length?`<div class="card" style="margin-top:14px"><div class="eyebrow" style="margin-bottom:4px">Phát sinh theo nhóm (chưa trừ trả nợ)</div>
      ${perGroup.map(x=>`<div class="row" style="cursor:default">${x.g.icon} <span class="name">${esc(x.g.name)}</span><div class="leader"></div><span class="${moneyClass(x.n)}">${fmt(Math.abs(x.n))}</span></div>`).join("")}
      <div class="caption-i">Số thực (đã trừ trả nợ) là ${fmt(Math.abs(net))} ở trên.</div></div>`:""}
    ${hist.length?`<div class="card" style="margin-top:14px"><div class="eyebrow" style="margin-bottom:4px">Lịch sử</div>
      ${hist.map(h=>`<div class="row" style="cursor:default">
        <div class="rowmain name">${esc(h.label)}<div class="sub">${dmyFull(h.date)} · ${esc(h.sub)}</div></div>
        <div class="leader"></div>
        <span class="${h.amt>0?"pos":"neg"}">${h.amt>0?"+":"−"}${fmt(Math.abs(h.amt))}</span>
      </div>`).join("")}</div>`:""}
  `);
  s.el.querySelector("[data-close]").onclick=s.close;
  s.el.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>openSettleModal(mid, b.dataset.act, net));

  if(rmBtn) rmBtn.onclick=()=>openRemindSheet(mid);
}

function openSettleModal(mid, dir, net){
  const m=memberById(mid);
  const suggest = dir==="received" ? Math.max(net,0) : Math.max(-net,0);
  const s=sheetOpen(`
    <div class="sheethead"><div class="h1">Ghi nhận trả tiền</div><button class="x" data-close>✕</button></div>
    <div class="field"><div class="seg" id="st-seg">
      <button data-d="received" class="${dir==="received"?"on":""}">${esc(m.name)} trả bạn</button>
      <button data-d="paid" class="${dir==="paid"?"on":""}">Bạn trả ${esc(m.name)}</button>
    </div></div>
    <div class="field"><label class="lbl">Số tiền</label>
      <input class="in" id="st-amt" inputmode="numeric" placeholder="0" value="${suggest?NF.format(suggest):""}" style="font-weight:800;font-size:20px"></div>
    <div class="field"><label class="lbl">Ngày</label><input class="in" id="st-date" type="date" value="${todayStr()}"></div>
    <div class="field"><label class="lbl">Ghi chú (không bắt buộc)</label><input class="in" id="st-note" placeholder="VD: chuyển khoản MB"></div>
    <button class="btn" id="st-save">Lưu</button>`);
  let curDir=dir;
  s.el.querySelector("[data-close]").onclick=s.close;
  s.el.querySelectorAll("#st-seg button").forEach(b=>b.onclick=()=>{
    curDir=b.dataset.d;
    s.el.querySelectorAll("#st-seg button").forEach(x=>x.classList.toggle("on",x===b));
  });
  bindMoney(s.el.querySelector("#st-amt"));
  s.el.querySelector("#st-save").onclick=async ()=>{
    const amt=getMoney(s.el.querySelector("#st-amt"));
    if(!amt) return toast("Nhập số tiền đã nhé", true);
    const btn=s.el.querySelector("#st-save"); btn.disabled=true;
    try{
      await run(sb.from("settlements").insert({
        member_id:mid, amount:amt, direction:curDir,
        note:s.el.querySelector("#st-note").value.trim()||null,
        settled_date:s.el.querySelector("#st-date").value||todayStr()
      }));
      await dbLoad(); closeAllSheets(); render(); toast("Đã ghi vào sổ ✓");
    }catch(e){ btn.disabled=false; }
  };
}

        </button>`;}).join("")}
      <div class="caption-i">Số hiển thị là nợ thực sau khi trừ tất cả lần trả nợ (gộp mọi nhóm).</div></div>`:""}
    ${exps.length?expHtml:`<div class="card"><div class="empty"><span class="big-ic">🧾</span>Chưa có khoản chi nào trong nhóm này.</div></div>`}`;
}

/* ---- tạo / sửa nhóm ---- */
const EMOJIS=["🚴","🧋","🍜","🍻","⚽","🏸","🎮","🎬","✈️","🏠","🎣","💼","👥"];
function openGroupModal(gid){
  const g = gid ? state.groups.find(x=>x.id===gid) : null;
  const selected = new Set(g ? state.groupMembers.filter(x=>x.group_id===gid).map(x=>x.member_id) : []);
  let icon = g?.icon || "👥";
  const s=sheetOpen(`
    <div class="sheethead"><div class="h1">${g?"Sửa nhóm":"Tạo nhóm mới"}</div><button class="x" data-close>✕</button></div>
    <div class="field"><label class="lbl">Tên nhóm</label>
      <input class="in" id="g-name" placeholder="VD: Đạp xe cuối tuần" value="${esc(g?.name||"")}"></div>
    <div class="field"><label class="lbl">Biểu tượng</label>
      <div class="emorow" id="g-emo">${EMOJIS.map(e=>`<button class="emo ${e===icon?"on":""}" data-e="${e}">${e}</button>`).join("")}</div></div>
    <div class="field"><label class="lbl">Thành viên (ngoài bạn — bạn luôn có mặt trong mọi nhóm)</label>
      <div class="card" style="margin:0;padding:4px 14px" id="g-mems"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input class="in" id="g-newmem" placeholder="Tên người mới, VD: Bình" style="flex:1">
        <button class="btn btn-ghost btn-sm" id="g-addmem" style="width:auto">＋ Thêm</button>
      </div></div>
    <button class="btn" id="g-save">${g?"Lưu thay đổi":"Tạo nhóm"}</button>
    ${g?`<button class="btn btn-danger" id="g-del" style="margin-top:10px">Xoá nhóm này</button>`:""}
  `);
  s.el.querySelector("[data-close]").onclick=s.close;
  const drawMems=()=>{
    const others=state.members.filter(m=>!m.is_me).sort((a,b)=>a.name.localeCompare(b.name,"vi"));
    s.el.querySelector("#g-mems").innerHTML = others.length ? others.map(m=>`
      <label class="sprow" style="cursor:pointer">
        <input type="checkbox" data-mid="${m.id}" ${selected.has(m.id)?"checked":""}>
        <div class="avatar" style="${avStyle(m.id)};width:30px;height:30px;font-size:13px">${esc(initials(m.name))}</div>
        <span class="name">${esc(m.name)}</span>
      </label>`).join("") : `<div class="sub" style="padding:10px 0">Chưa có ai — thêm người mới bên dưới.</div>`;
    s.el.querySelectorAll("#g-mems input").forEach(c=>c.onchange=()=>{ c.checked?selected.add(c.dataset.mid):selected.delete(c.dataset.mid); });
  };
  drawMems();
  s.el.querySelectorAll("#g-emo .emo").forEach(b=>b.onclick=()=>{
    icon=b.dataset.e;
    s.el.querySelectorAll("#g-emo .emo").forEach(x=>x.classList.toggle("on",x===b));
  });
  s.el.querySelector("#g-addmem").onclick=async ()=>{
    const inp=s.el.querySelector("#g-newmem"); const name=inp.value.trim();
    if(!name) return;
    const rows=await run(sb.from("members").insert({name}).select());
    state.members.push(rows[0]); selected.add(rows[0].id);
    inp.value=""; drawMems(); toast(`Đã thêm ${name}`);
  };
  s.el.querySelector("#g-save").onclick=async ()=>{
    const name=s.el.querySelector("#g-name").value.trim();
    if(!name) return toast("Đặt tên nhóm đã nhé", true);
    if(!selected.size) return toast("Chọn ít nhất 1 thành viên", true);
    const btn=s.el.querySelector("#g-save"); btn.disabled=true;
    try{
      let theId=gid;
      if(g){ await run(sb.from("groups").update({name, icon}).eq("id", gid)); }
      else{ const rows=await run(sb.from("groups").insert({name, icon}).select()); theId=rows[0].id; }
      await run(sb.from("group_members").delete().eq("group_id", theId));
      await run(sb.from("group_members").insert([...selected].map(mid=>({group_id:theId, member_id:mid}))));
      await dbLoad(); closeAllSheets(); state.ui.groupId=theId; state.ui.tab="nhom"; render();
      toast(g?"Đã lưu nhóm ✓":"Đã tạo nhóm ✓");
    }catch(e){ btn.disabled=false; }
  };
  const del=s.el.querySelector("#g-del");
  if(del) del.onclick=async ()=>{
    if(!(await ask("Xoá nhóm sẽ xoá toàn bộ khoản chi trong nhóm (kể cả các khoản đã cộng sang chi tiêu cá nhân). Chắc chưa?"))) return;
    await run(sb.from("groups").delete().eq("id", gid));
    await dbLoad(); closeAllSheets(); state.ui.groupId=null; render(); toast("Đã xoá nhóm");
  };
}

/* ================= THÊM / SỬA KHOẢN CHI NHÓM ================= */
function openExpenseModal(gid, expId){
  const g=state.groups.find(x=>x.id===gid); if(!g) return;
  const my=me();
  const exp = expId ? state.expenses.find(e=>e.id===expId) : null;
  const exSplits = exp ? splitsOf(exp.id) : [];

  let cands=[my, ...membersOf(gid)];
  if(exp){
    for(const sp of exSplits) if(!cands.some(c=>c.id===sp.member_id)){ const m=memberById(sp.member_id); if(m) cands.push(m); }
    if(!cands.some(c=>c.id===exp.payer_id)){ const m=memberById(exp.payer_id); if(m) cands.push(m); }
  }
  const rows=cands.map(m=>{
    const sp=exSplits.find(x=>x.member_id===m.id);
    return { id:m.id, name:m.is_me?"Bạn":m.name, isMe:!!m.is_me,
             checked: exp ? !!sp : false, amount: sp ? sp.amount : 0, touched: exp ? !!sp : false };
  });
  const linked = exp ? state.personal.find(p=>p.source_expense_id===exp.id) : null;
  const lastCat = localStorage.getItem(LASTCAT_KEY);
  const defCat = linked?.category_id || (state.categories.some(c=>c.id===lastCat)?lastCat:state.categories[0]?.id) || "";

  const s=sheetOpen(`
    <div class="sheethead"><div class="h1">${exp?"Sửa khoản chi":"Khoản chi mới"} · ${g.icon||""}</div><button class="x" data-close>✕</button></div>
    <div class="field"><label class="lbl">Chi cho việc gì?</label>
      <input class="in" id="ex-desc" placeholder="VD: Ăn trưa sau khi đạp" value="${esc(exp?.description||"")}"></div>
    <div class="field" style="display:flex;gap:10px">
      <div style="flex:1.3"><label class="lbl">Tổng tiền</label>
        <input class="in" id="ex-amt" inputmode="numeric" placeholder="0" value="${exp?NF.format(exp.amount):""}" style="font-weight:800;font-size:19px"></div>
      <div style="flex:1"><label class="lbl">Ngày</label>
        <input class="in" id="ex-date" type="date" value="${exp?exp.expense_date:todayStr()}"></div>
    </div>
    <div class="field"><label class="lbl">Ai trả tiền?</label>
      <select class="in" id="ex-payer">${cands.map(m=>`<option value="${m.id}" ${(exp?exp.payer_id:my.id)===m.id?"selected":""}>${esc(m.is_me?"Bạn (tôi)":m.name)}</option>`).join("")}</select></div>
    <div class="field">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <label class="lbl" style="margin:0;flex:1">Chia cho ai?</label>
        <button class="link" id="ex-all">Chọn tất cả</button>
        <button class="link" id="ex-eq">⟳ Chia đều lại</button>
      </div>
      <div class="card" style="margin:6px 0 0;padding:4px 14px" id="ex-rows">${rows.map(r=>`
        <div class="sprow">
          <input type="checkbox" data-cb="${r.id}" ${r.checked?"checked":""}>
          <span class="name" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</span>
          <input class="amt" data-amt="${r.id}" inputmode="numeric" value="${r.amount?NF.format(r.amount):"0"}" ${r.checked?"":"disabled"}>
        </div>`).join("")}
        <div class="sumline"><span id="ex-sumlbl">Đã chia</span><span id="ex-sum">0 đ</span></div>
      </div>
    </div>
    <div class="mybox" id="ex-mybox" style="display:none">
      <label><input type="checkbox" id="ex-addp" ${linked?"checked":""}>
        <span>Cộng phần của bạn (<b id="ex-myshare">0 đ</b>) vào <b>Chi tiêu cá nhân</b></span></label>
      <select class="in" id="ex-cat" style="margin-top:10px;${linked?"":"display:none"}">
        ${state.categories.map(c=>`<option value="${c.id}" ${c.id===defCat?"selected":""}>${esc(c.icon)} ${esc(c.name)}</option>`).join("")}</select>
    </div>
    <button class="btn" id="ex-save" style="margin-top:14px">${exp?"Lưu thay đổi":"Ghi vào sổ"}</button>
    ${exp?`<button class="btn btn-danger" id="ex-del" style="margin-top:10px">Xoá khoản chi này</button>`:""}
  `);
  const el=id=>s.el.querySelector(id);
  s.el.querySelector("[data-close]").onclick=s.close;

  const amtInp=el("#ex-amt");
  const recompute=()=>{
    const total=getMoney(amtInp);
    const checked=rows.filter(r=>r.checked);
    const auto=checked.filter(r=>!r.touched);
    const manual=checked.filter(r=>r.touched);
    const pool=Math.max(total - manual.reduce((a,r)=>a+r.amount,0), 0);
    const dist=equalSplit(pool, auto.length);
    auto.forEach((r,i)=>{ r.amount=dist[i]||0;
      const inp=s.el.querySelector(`[data-amt="${r.id}"]`);
      inp.value=r.amount?NF.format(r.amount):"0"; inp.dataset.raw=r.amount; });
    const sum=checked.reduce((a,r)=>a+r.amount,0);
    const diff=total-sum;
    const sumEl=el("#ex-sum"), lbl=el("#ex-sumlbl");
    if(!checked.length){ lbl.textContent="Chọn ít nhất 1 người"; sumEl.textContent=""; lbl.className="sum-bad"; }
    else if(diff===0){ lbl.textContent="Đã chia đủ ✓"; lbl.className="sum-ok"; sumEl.className="sum-ok"; sumEl.textContent=fmtPlain(sum); }
    else{ lbl.textContent=diff>0?"Còn thiếu":"Đang thừa"; lbl.className="sum-bad"; sumEl.className="sum-bad"; sumEl.textContent=fmtPlain(Math.abs(diff)); }
    el("#ex-save").disabled = !(total>0 && checked.length && diff===0);
    el("#ex-all").textContent = rows.every(r=>r.checked) ? "Bỏ chọn tất cả" : "Chọn tất cả";
    const myRow=rows.find(r=>r.isMe);
    el("#ex-mybox").style.display = myRow.checked ? "" : "none";
    el("#ex-myshare").textContent = fmtPlain(myRow.amount);
  };
  bindMoney(amtInp, recompute);
  rows.forEach(r=>{
    const cb=s.el.querySelector(`[data-cb="${r.id}"]`);
    const ai=s.el.querySelector(`[data-amt="${r.id}"]`);
    cb.onchange=()=>{ r.checked=cb.checked;
      if(!r.checked){ r.touched=false; r.amount=0; ai.value="0"; ai.dataset.raw=0; ai.disabled=true; }
      else ai.disabled=false;
      recompute(); };
    bindMoney(ai, raw=>{ if(!r.checked) return; r.touched=true; r.amount=raw; recompute(); });
  });
  el("#ex-all").onclick=()=>{
    const turnOn = !rows.every(r=>r.checked);
    rows.forEach(r=>{
      r.checked=turnOn; r.touched=false;
      const cb=s.el.querySelector(`[data-cb="${r.id}"]`);
      const ai=s.el.querySelector(`[data-amt="${r.id}"]`);
      cb.checked=turnOn; ai.disabled=!turnOn;
      if(!turnOn){ r.amount=0; ai.value="0"; ai.dataset.raw=0; }
    });
    recompute();
  };
  el("#ex-eq").onclick=()=>{ rows.forEach(r=>{ if(r.checked) r.touched=false; }); recompute(); };
  el("#ex-addp").onchange=()=>{ el("#ex-cat").style.display = el("#ex-addp").checked ? "" : "none"; };
  recompute();

  el("#ex-save").onclick=async ()=>{
    const desc=el("#ex-desc").value.trim();
    const total=getMoney(amtInp);
    const checked=rows.filter(r=>r.checked);
    if(!desc) return toast("Ghi tên khoản chi đã nhé", true);
    if(!total) return toast("Nhập tổng tiền đã nhé", true);
    const btn=el("#ex-save"); btn.disabled=true;
    try{
      const payload={ group_id:gid, description:desc, amount:total,
        payer_id:el("#ex-payer").value, expense_date:el("#ex-date").value||todayStr() };
      let theId=exp?.id;
      if(exp){ await run(sb.from("expenses").update(payload).eq("id", exp.id));
               await run(sb.from("expense_splits").delete().eq("expense_id", exp.id)); }
      else{ const r=await run(sb.from("expenses").insert(payload).select()); theId=r[0].id; }
      const splitRows=checked.filter(r=>r.amount>0).map(r=>({expense_id:theId, member_id:r.id, amount:r.amount}));
      if(splitRows.length) await run(sb.from("expense_splits").insert(splitRows));

      const myRow=rows.find(r=>r.isMe);
      const wantP = myRow.checked && el("#ex-addp").checked && myRow.amount>0;
      const catId = el("#ex-cat").value || null;
      if(wantP){
        localStorage.setItem(LASTCAT_KEY, catId||"");
        const pp={ amount:myRow.amount, category_id:catId, description:desc,
                   expense_date:payload.expense_date, source_expense_id:theId };
        if(linked) await run(sb.from("personal_expenses").update(pp).eq("id", linked.id));
        else await run(sb.from("personal_expenses").insert(pp));
      }else if(linked){
        await run(sb.from("personal_expenses").delete().eq("id", linked.id));
      }
      await dbLoad(); closeAllSheets(); render();
      toast(exp?"Đã lưu thay đổi ✓":"Đã ghi vào sổ ✓");
    }catch(e){ btn.disabled=false; }
  };
  const delBtn=el("#ex-del");
  if(delBtn) delBtn.onclick=async ()=>{
    if(!(await ask("Xoá khoản chi này? Khoản chi tiêu cá nhân liên kết (nếu có) cũng bị xoá."))) return;
    await run(sb.from("expenses").delete().eq("id", exp.id));
    await dbLoad(); closeAllSheets(); render(); toast("Đã xoá");
  };
}

/* ================= TRANG CÁ NHÂN ================= */
const PAL=["#0E6B47","#B0447E","#2E5E93","#A8730F","#5B3F9E","#1F7A6C","#C14A2D","#647A2B","#8A5A44","#4A5AB5","#71806F"];
function monthOf(d){ return (d||"").slice(0,7); }
function monthDays(mo){ const [y,m]=mo.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function shortMoney(n){
  if(n>=1000000) return (n/1000000).toFixed(n%1000000?1:0).replace(".",",")+"tr";
  if(n>=1000 && n%1000===0) return (n/1000)+"k";
  return NF.format(n);
}
function changeMonth(delta){
  const [y,m]=state.ui.month.split("-").map(Number);
  const d=new Date(y, m-1+delta, 1);
  state.ui.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  render();
}
function donutCSS(parts){
  const total=parts.reduce((a,p)=>a+p.val,0)||1;
  let acc=0;
  const stops=parts.map(p=>{ const a=acc/total*360; acc+=p.val; return `${p.color} ${a}deg ${acc/total*360}deg`; });
  return `conic-gradient(${stops.join(",")})`;
}
function spentInMonth(mo, catId){
  return state.personal.filter(p=>monthOf(p.expense_date)===mo && (!catId || p.category_id===catId))
    .reduce((a,p)=>a+p.amount,0);
}

function viewPersonal(){
  const mo=state.ui.month;
  const list=state.personal.filter(p=>monthOf(p.expense_date)===mo);
  const total=list.reduce((a,p)=>a+p.amount,0);
  const incs=state.incomes.filter(i=>monthOf(i.income_date)===mo);
  const income=incs.reduce((a,i)=>a+i.amount,0);
  const left=income-total;

  const [y,m]=mo.split("-").map(Number);
  const pd=new Date(y, m-2, 1);
  const prevMo=`${pd.getFullYear()}-${String(pd.getMonth()+1).padStart(2,"0")}`;
  const prevTotal=spentInMonth(prevMo);

  /* --- thẻ số dư --- */
  let balCard;
  if(income>0){
    const pct=Math.min(100, Math.round(total/income*100));
    const save=Math.round(left/income*100);
    balCard=`<div class="card" style="background:var(--ink);color:#fff">
      <div class="eyebrow" style="color:rgba(255,255,255,.65)">Còn lại trong tháng</div>
      <div class="money big" style="color:${left<0?"#FFB4A0":"#fff"}">${left<0?"−":""}${NF.format(Math.abs(left))}<span class="d">đ</span></div>
      <div class="pbar dark"><div class="pfill" style="width:${pct}%;background:${total>income?"#FFB4A0":"#7FD3A8"}"></div></div>
      <div class="splitstat">
        <div><div class="eyebrow" style="color:rgba(255,255,255,.55)">Thu nhập</div>
          <div class="money" style="font-size:15px">${NF.format(income)}<span class="d">đ</span></div></div>
        <div><div class="eyebrow" style="color:rgba(255,255,255,.55)">Đã chi</div>
          <div class="money" style="font-size:15px">${NF.format(total)}<span class="d">đ</span></div></div>
        <div><div class="eyebrow" style="color:rgba(255,255,255,.55)">Để dành</div>
          <div class="money" style="font-size:15px;color:${save<0?"#FFB4A0":"#7FD3A8"}">${save}%</div></div>
      </div></div>`;
  }else{
    let delta="";
    if(prevTotal>0 && total>0){
      const pct=Math.round((total-prevTotal)/prevTotal*100);
      delta = pct===0 ? "bằng tháng trước"
            : pct>0 ? `<span style="color:#FFD9CC">▲ hơn tháng trước ${pct}%</span>`
                    : `<span style="color:#CFF3DE">▼ ít hơn tháng trước ${-pct}%</span>`;
    }
    balCard=`<div class="card" style="background:var(--ink);color:#fff">
      <div class="eyebrow" style="color:rgba(255,255,255,.65)">Đã chi trong tháng</div>
      <div class="money big">${NF.format(total)}<span class="d">đ</span></div>
      ${delta?`<div style="margin-top:6px;font-size:13px;font-weight:600">${delta}</div>`:""}
      <div style="margin-top:10px;font-size:12.5px;color:rgba(255,255,255,.6)">Ghi thu nhập tháng này để xem còn tiêu được bao nhiêu.</div>
    </div>`;
  }

  /* --- ghi nhanh --- */
  const quickCard = state.quick.length ? `
    <div class="eyebrow" style="margin-bottom:7px">Ghi nhanh · bấm 1 lần là xong</div>
    <div class="chips" style="margin-bottom:14px">
      ${state.quick.map(q=>`<button class="qchip" onclick="quickAdd('${q.id}')">${esc(q.icon||"⚡")} ${esc(q.label)} <b>${shortMoney(q.amount)}</b></button>`).join("")}
    </div>` : "";

  /* --- hạn mức --- */
  const buds=state.budgets.filter(b=>b.month===mo)
    .map(b=>({b, cat:catById(b.category_id), spent:spentInMonth(mo, b.category_id)}))
    .filter(x=>x.cat)
    .sort((a,b)=>(b.spent/b.b.amount)-(a.spent/a.b.amount));
  let budCard;
  if(buds.length){
    budCard=`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <div class="eyebrow">Hạn mức ${monthLabel(mo).toLowerCase()}</div>
        <button class="link" onclick="openBudgetModal()">Sửa</button></div>
      ${buds.map(x=>{
        const pct=Math.min(100, Math.round(x.spent/x.b.amount*100));
        const over=x.spent-x.b.amount;
        const color = over>0 ? "var(--red)" : (pct>=80 ? "var(--amber)" : "var(--green)");
        return `<div class="budrow">
          <div class="budtop">
            <span>${esc(x.cat.icon)}</span><span class="name" style="flex:1">${esc(x.cat.name)}</span>
            <span class="money" style="font-size:13.5px;color:${color}">${shortMoney(x.spent)}</span>
            <span class="sub">/ ${shortMoney(x.b.amount)}</span>
          </div>
          <div class="pbar"><div class="pfill" style="width:${pct}%;background:${color}"></div></div>
          ${over>0?`<div class="sub" style="color:var(--red);margin-top:5px">Vượt ${fmtPlain(over)}</div>`
                  :`<div class="sub" style="margin-top:5px">Còn ${fmtPlain(-over)}</div>`}
        </div>`;}).join("")}
    </div>`;
  }else{
    budCard=`<div class="card"><div class="eyebrow" style="margin-bottom:8px">Hạn mức chi tiêu</div>
      <div class="sub" style="margin-bottom:10px">Đặt mức trần cho từng danh mục để biết khi nào tiêu quá tay.</div>
      <button class="btn btn-line" onclick="openBudgetModal()">＋ Đặt hạn mức ${monthLabel(mo).toLowerCase()}</button></div>`;
  }

  /* --- biểu đồ danh mục --- */
  const byCat=new Map();
  for(const p of list){
    const key=p.category_id||"_none";
    byCat.set(key,(byCat.get(key)||0)+p.amount);
  }
  const parts=[...byCat.entries()].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v)
    .map((x,i)=>({...x, color:PAL[i%PAL.length], cat:catById(x.k)}));
  let catCard="";
  if(parts.length){
    catCard=`<div class="card"><div class="eyebrow" style="margin-bottom:10px">Theo danh mục</div>
      <div class="donutwrap">
        <div class="donut" style="background:${donutCSS(parts.map(p=>({color:p.color,val:p.v})))}"></div>
        <div class="legend">${parts.map(p=>`
          <div class="lrow"><span class="dot" style="background:${p.color}"></span>
            <span class="name" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${p.cat?esc(p.cat.icon+" "+p.cat.name):"🏷️ Khác"}</span>
            <span class="money" style="font-weight:700">${NF.format(p.v)}<span class="d">đ</span></span>
            <span class="sub" style="width:34px;text-align:right">${Math.round(p.v/(total||1)*100)}%</span></div>`).join("")}
        </div></div></div>`;
  }

  /* --- thu nhập --- */
  const incCard = incs.length ? `<div class="card">
    <div class="eyebrow" style="margin-bottom:2px">Thu nhập tháng này</div>
    ${incs.map(i=>`<button class="row" onclick="openIncomeModal('${i.id}')">
      <div class="avatar av-g" style="font-size:17px">💰</div>
      <div class="rowmain name">${esc(i.source||"Thu nhập")}<div class="sub">${dmyFull(i.income_date)}</div></div>
      <div class="leader"></div><span class="pos">${fmt(i.amount)}</span></button>`).join("")}
  </div>` : "";

  /* --- lịch sử --- */
  const byDay={};
  for(const p of list)(byDay[p.expense_date]=byDay[p.expense_date]||[]).push(p);
  const days=Object.keys(byDay).sort().reverse();
  let hist="";
  for(const d of days){
    hist+=`<div class="dayhead">${dayLabel(d)}</div><div class="card" style="padding:4px 16px">`;
    for(const p of byDay[d]){
      const c=catById(p.category_id);
      const tag = p.source_expense_id ? " · từ chi nhóm" : "";
      hist+=`<button class="row" onclick="openPersonalModal('${p.id}')">
        <div class="avatar av-g" style="font-size:17px">${c?esc(c.icon):"🏷️"}</div>
        <div class="rowmain name">${esc(p.description||c?.name||"Chi tiêu")}<div class="sub">${c?esc(c.name):"Chưa phân loại"}${tag}</div></div>
        <div class="leader"></div>${fmt(p.amount)}</button>`;
    }
    hist+=`</div>`;
  }

  return `
    <div class="eyebrow">Chi tiêu cá nhân</div>
    <div class="monthnav">
      <button class="mbtn" onclick="changeMonth(-1)">‹</button>
      <h1 class="h1">${monthLabel(mo)}</h1>
      <button class="mbtn" onclick="changeMonth(1)">›</button>
    </div>
    ${balCard}
    ${quickCard}
    <div class="btnrow" style="margin-bottom:14px">
      <button class="btn" onclick="openPersonalModal()">＋ Chi tiêu</button>
      <button class="btn btn-ghost" onclick="openIncomeModal()">＋ Thu nhập</button>
    </div>
    ${budCard}
    ${catCard}
    ${incCard}
    ${list.length?hist:`<div class="card"><div class="empty"><span class="big-ic">☕</span>Chưa ghi khoản chi nào trong ${monthLabel(mo).toLowerCase()}.</div></div>`}`;
}

function openPersonalModal(pid){

  const s=sheetOpen(`
    <div class="sheethead"><div class="h1">${p?"Sửa chi tiêu":"Chi tiêu mới"}</div><button class="x" data-close>✕</button></div>

    <div class="field" style="display:flex;gap:10px">
      <div style="flex:1.3"><label class="lbl">Số tiền</label>

      <div style="flex:1"><label class="lbl">Ngày</label>

      <div class="chips" id="p-cats">${state.categories.map(c=>`

    <div class="field"><label class="lbl">Ghi chú (không bắt buộc)</label>

    ${p?`<button class="btn btn-danger" id="p-del" style="margin-top:10px">Xoá khoản này</button>`:""}
  `);
  s.el.querySelector("[data-close]").onclick=s.close;

  });
  setTimeout(()=>{ if(!p) s.el.querySelector("#p-amt").focus(); }, 60);
  s.el.querySelector("#p-save").onclick=async ()=>{
    const amt=getMoney(s.el.querySelector("#p-amt"));
    if(!amt) return toast("Nhập số tiền đã nhé", true);
    const btn=s.el.querySelector("#p-save"); btn.disabled=true;
    try{
      const pp={ amount:amt, category_id:catId, description:s.el.querySelector("#p-desc").value.trim()||null,
                 expense_date:s.el.querySelector("#p-date").value||todayStr() };
      if(catId) localStorage.setItem(LASTCAT_KEY, catId);
      if(p) await run(sb.from("personal_expenses").update(pp).eq("id", p.id));
      else await run(sb.from("personal_expenses").insert(pp));
      await dbLoad(); closeAllSheets(); render(); toast("Đã ghi vào sổ ✓");
    }catch(e){ btn.disabled=false; }
  };
  const del=s.el.querySelector("#p-del");
  if(del) del.onclick=async ()=>{
    if(!(await ask("Xoá khoản chi tiêu này?"))) return;
    await run(sb.from("personal_expenses").delete().eq("id", p.id));
    await dbLoad(); closeAllSheets(); render(); toast("Đã xoá");
  };
}

/* ================= HẠN MỨC THEO DANH MỤC ================= */
function openBudgetModal(){
  const mo=state.ui.month;
  const cur=new Map(state.budgets.filter(b=>b.month===mo).map(b=>[b.category_id,b.amount]));
  const [y,m]=mo.split("-").map(Number);
  const pd=new Date(y, m-2, 1);
  const prevMo=`${pd.getFullYear()}-${String(pd.getMonth()+1).padStart(2,"0")}`;
  const hasPrev=state.budgets.some(b=>b.month===prevMo);
  const s=sheetOpen(`
    <div class="sheethead"><div class="h1">Hạn mức ${monthLabel(mo).toLowerCase()}</div><button class="x" data-close>✕</button></div>
    <div class="sub" style="margin-bottom:12px">Để trống hoặc 0 nghĩa là không giới hạn danh mục đó.</div>
    ${hasPrev?`<button class="btn btn-line" id="b-copy" style="margin-bottom:12px">⧉ Lấy lại hạn mức tháng trước</button>`:""}
    <div class="card" style="padding:4px 14px">
      ${state.categories.map(c=>`
        <div class="sprow">
          <span style="font-size:18px">${esc(c.icon)}</span>
          <span class="name" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</span>
          <input class="amt" data-b="${c.id}" inputmode="numeric" placeholder="0" value="${cur.get(c.id)?NF.format(cur.get(c.id)):""}">
        </div>`).join("")}
      <div class="sumline"><span>Tổng hạn mức</span><span id="b-sum">0 đ</span></div>
    </div>
    <button class="btn" id="b-save" style="margin-top:14px">Lưu hạn mức</button>`);
  s.el.querySelector("[data-close]").onclick=s.close;
  const inputs=[...s.el.querySelectorAll("[data-b]")];
  const sum=()=>{ s.el.querySelector("#b-sum").textContent=fmtPlain(inputs.reduce((a,i)=>a+getMoney(i),0)); };
  inputs.forEach(i=>bindMoney(i, sum));
  sum();
  const copyBtn=s.el.querySelector("#b-copy");
  if(copyBtn) copyBtn.onclick=()=>{
    const prev=new Map(state.budgets.filter(b=>b.month===prevMo).map(b=>[b.category_id,b.amount]));
    inputs.forEach(i=>{ const v=prev.get(i.dataset.b)||0; i.value=v?NF.format(v):""; i.dataset.raw=v; });
    sum(); toast("Đã lấy lại hạn mức tháng trước");
  };
  s.el.querySelector("#b-save").onclick=async ()=>{
    const btn=s.el.querySelector("#b-save"); btn.disabled=true;
    try{
      const rows=inputs.map(i=>({month:mo, category_id:i.dataset.b, amount:getMoney(i)})).filter(r=>r.amount>0);
      await run(sb.from("budgets").delete().eq("month", mo));
      if(rows.length) await run(sb.from("budgets").insert(rows));
      await dbLoad(); closeAllSheets(); render(); toast("Đã lưu hạn mức ✓");
    }catch(e){ btn.disabled=false; }
  };
}

/* ================= QUỸ ================= */
const FUND_EMOJIS=["🏦","🐷","🚴","🧋","✈️","🎉","🏠","⚽","🎁","📚","🚗","💍"];
function fundTxnsOf(fid){ return state.fundTxns.filter(t=>t.fund_id===fid); }
function fundBalance(fid){
  return fundTxnsOf(fid).reduce((a,t)=>a + (t.kind==="in" ? t.amount : -t.amount), 0);
}
function openFund(fid){ state.ui.fundId=fid; render(); window.scrollTo(0,0); }
function backToFunds(){ state.ui.fundId=null; render(); }

function viewFunds(){
  const total=state.funds.reduce((a,f)=>a+fundBalance(f.id),0);
  const list=state.funds.map(f=>{
    const bal=fundBalance(f.id);
    const n=fundTxnsOf(f.id).length;
    return `<button class="row" onclick="openFund('${f.id}')">
      <div class="avatar av-g" style="font-size:20px">${esc(f.icon||"🏦")}</div>
      <div class="rowmain name">${esc(f.name)}<div class="sub">${n} lần thu/chi</div></div>
      <div class="leader"></div>
      <div class="${bal<0?"neg":""}">${fmt(bal)}</div>
    </button>`;
  }).join("");
  return `
    <div class="eyebrow">Tiền bạn đang giữ hộ</div>
    <h1 class="h1">Quỹ</h1>
    <div class="card" style="background:var(--green);color:#fff">
      <div class="eyebrow" style="color:rgba(255,255,255,.75)">Tổng đang giữ</div>
      <div class="money big">${NF.format(total)}<span class="d">đ</span></div>
      ${state.funds.length>1?`<div style="margin-top:6px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.85)">${state.funds.length} quỹ</div>`:""}
    </div>
    ${state.funds.length?`<div class="card">${list}</div>`
      :`<div class="card"><div class="empty"><span class="big-ic">🐷</span>Chưa có quỹ nào.<br>VD: "Quỹ nhóm đạp xe", "Quỹ lớp"…</div></div>`}
    <button class="btn" onclick="openFundModal()">＋ Tạo quỹ mới</button>`;
}

function viewFundDetail(){
  const f=state.funds.find(x=>x.id===state.ui.fundId);
  if(!f){ state.ui.fundId=null; return viewFunds(); }
  const txns=fundTxnsOf(f.id);
  const bal=fundBalance(f.id);
  const tin=txns.filter(t=>t.kind==="in").reduce((a,t)=>a+t.amount,0);
  const tout=txns.filter(t=>t.kind==="out").reduce((a,t)=>a+t.amount,0);

  const byDay={};
  for(const t of txns)(byDay[t.txn_date]=byDay[t.txn_date]||[]).push(t);
  let hist="";
  for(const d of Object.keys(byDay).sort().reverse()){
    hist+=`<div class="dayhead">${dayLabel(d)}</div><div class="card" style="padding:4px 16px">`;
    for(const t of byDay[d]){
      hist+=`<button class="row" onclick="openFundTxnModal('${f.id}','${t.kind}','${t.id}')">
        <div class="avatar" style="${t.kind==="in"?"background:var(--green-soft);color:var(--green)":"background:var(--red-soft);color:var(--red)"};font-size:16px">${t.kind==="in"?"＋":"−"}</div>
        <div class="rowmain name">${esc(t.note||(t.kind==="in"?"Thêm vào quỹ":"Chi từ quỹ"))}<div class="sub">${t.kind==="in"?"thu vào":"chi ra"}</div></div>
        <div class="leader"></div>
        <span class="${t.kind==="in"?"pos":"neg"}">${t.kind==="in"?"+":"−"}${fmt(t.amount)}</span>
      </button>`;
    }
    hist+=`</div>`;
  }

  return `
    <div class="top">
      <button class="back" onclick="backToFunds()">‹</button>
      <h1 class="h1" style="margin:0;flex:1;font-size:21px">${esc(f.icon||"🏦")} ${esc(f.name)}</h1>
      <button class="iconbtn" onclick="openFundModal('${f.id}')" title="Sửa quỹ">✎</button>
    </div>
    <div class="card" style="background:var(--ink);color:#fff">
      <div class="eyebrow" style="color:rgba(255,255,255,.65)">Số dư quỹ</div>
      <div class="money big" style="color:${bal<0?"#FFB4A0":"#fff"}">${bal<0?"−":""}${NF.format(Math.abs(bal))}<span class="d">đ</span></div>
      <div class="splitstat">
        <div><div class="eyebrow" style="color:rgba(255,255,255,.55)">Đã thu vào</div>
          <div class="money" style="font-size:15px;color:#7FD3A8">${NF.format(tin)}<span class="d">đ</span></div></div>
        <div><div class="eyebrow" style="color:rgba(255,255,255,.55)">Đã chi ra</div>
          <div class="money" style="font-size:15px;color:#FFB4A0">${NF.format(tout)}<span class="d">đ</span></div></div>
      </div>
    </div>
    <div class="btnrow" style="margin-bottom:14px">
      <button class="btn" onclick="openFundTxnModal('${f.id}','in')">＋ Thêm vào quỹ</button>
      <button class="btn btn-danger" onclick="openFundTxnModal('${f.id}','out')">− Chi từ quỹ</button>
    </div>
    ${txns.length?hist:`<div class="card"><div class="empty"><span class="big-ic">🧾</span>Quỹ chưa có giao dịch nào.</div></div>`}`;
}

      <input class="in" id="f-init" inputmode="numeric" placeholder="0" style="font-weight:800;font-size:19px">
      <div class="sub" style="margin-top:5px">Ghi số hiện tại, sau này thu thêm hay chi ra thì thêm giao dịch trong quỹ.</div></div>`}
    <button class="btn" id="f-save">${f?"Lưu thay đổi":"Tạo quỹ"}</button>
    ${f?`<button class="btn btn-danger" id="f-del" style="margin-top:10px">Xoá quỹ này</button>`:""}`);
  s.el.querySelector("[data-close]").onclick=s.close;
  const initInp=s.el.querySelector("#f-init");
  if(initInp) bindMoney(initInp);
  s.el.querySelectorAll("#f-emo .emo").forEach(b=>b.onclick=()=>{
    icon=b.dataset.e; s.el.querySelectorAll("#f-emo .emo").forEach(x=>x.classList.toggle("on",x===b));
  });
  s.el.querySelector("#f-save").onclick=async ()=>{
    const name=s.el.querySelector("#f-name").value.trim();
    if(!name) return toast("Đặt tên quỹ đã nhé", true);
    const btn=s.el.querySelector("#f-save"); btn.disabled=true;
    try{
      if(f){ await run(sb.from("funds").update({name, icon}).eq("id", f.id)); }
      else{
        const rows=await run(sb.from("funds").insert({name, icon}).select());
        const init=getMoney(initInp);
        if(init>0) await run(sb.from("fund_txns").insert({
          fund_id:rows[0].id, amount:init, kind:"in", note:"Số tiền ban đầu", txn_date:todayStr() }));
        state.ui.fundId=rows[0].id;
      }
      await dbLoad(); closeAllSheets(); state.ui.tab="quy"; render();
      toast(f?"Đã lưu ✓":"Đã tạo quỹ ✓");
    }catch(e){ btn.disabled=false; }
  };
  const del=s.el.querySelector("#f-del");
  if(del) del.onclick=async ()=>{
    if(!(await ask("Xoá quỹ này cùng toàn bộ giao dịch bên trong?"))) return;
    await run(sb.from("funds").delete().eq("id", f.id));
    await dbLoad(); closeAllSheets(); state.ui.fundId=null; render(); toast("Đã xoá quỹ");
  };
}

function openFundTxnModal(fid, kind, txnId){
  const f=state.funds.find(x=>x.id===fid); if(!f) return;
  const t = txnId ? state.fundTxns.find(x=>x.id===txnId) : null;
  let curKind = t?.kind || kind || "in";
  const s=sheetOpen(`
    <div class="sheethead"><div class="h1">${t?"Sửa giao dịch":(curKind==="in"?"Thêm vào quỹ":"Chi từ quỹ")}</div><button class="x" data-close>✕</button></div>
    <div class="field"><div class="seg" id="t-seg">
      <button data-k="in" class="${curKind==="in"?"on":""}">＋ Thu vào</button>
      <button data-k="out" class="${curKind==="out"?"on":""}">− Chi ra</button>
    </div></div>
    <div class="field" style="display:flex;gap:10px">
      <div style="flex:1.3"><label class="lbl">Số tiền</label>
        <input class="in" id="t-amt" inputmode="numeric" placeholder="0" value="${t?NF.format(t.amount):""}" style="font-weight:800;font-size:19px"></div>
      <div style="flex:1"><label class="lbl">Ngày</label>
        <input class="in" id="t-date" type="date" value="${t?t.txn_date:todayStr()}"></div>
    </div>
    <div class="field"><label class="lbl">Nội dung</label>
      <input class="in" id="t-note" placeholder="VD: B nộp quỹ tháng 9" value="${esc(t?.note||"")}"></div>
    <button class="btn" id="t-save">${t?"Lưu thay đổi":"Ghi vào quỹ"}</button>
    ${t?`<button class="btn btn-danger" id="t-del" style="margin-top:10px">Xoá giao dịch</button>`:""}`);
  s.el.querySelector("[data-close]").onclick=s.close;
  bindMoney(s.el.querySelector("#t-amt"));
  s.el.querySelectorAll("#t-seg button").forEach(b=>b.onclick=()=>{
    curKind=b.dataset.k;
    s.el.querySelectorAll("#t-seg button").forEach(x=>x.classList.toggle("on",x===b));
  });
  setTimeout(()=>{ if(!t) s.el.querySelector("#t-amt").focus(); }, 60);
  s.el.querySelector("#t-save").onclick=async ()=>{
    const amt=getMoney(s.el.querySelector("#t-amt"));
    if(!amt) return toast("Nhập số tiền đã nhé", true);
    const btn=s.el.querySelector("#t-save"); btn.disabled=true;
    try{
      const pp={ fund_id:fid, amount:amt, kind:curKind,
                 note:s.el.querySelector("#t-note").value.trim()||null,
                 txn_date:s.el.querySelector("#t-date").value||todayStr() };
      if(t) await run(sb.from("fund_txns").update(pp).eq("id", t.id));
      else await run(sb.from("fund_txns").insert(pp));
      await dbLoad(); closeAllSheets(); render(); toast("Đã ghi vào quỹ ✓");
    }catch(e){ btn.disabled=false; }
  };
  const del=s.el.querySelector("#t-del");
  if(del) del.onclick=async ()=>{
    if(!(await ask("Xoá giao dịch này?"))) return;
    await run(sb.from("fund_txns").delete().eq("id", t.id));
    await dbLoad(); closeAllSheets(); render(); toast("Đã xoá");
  };
}

/* ================= TIN NHẮN NHẮC NỢ ================= */
function remindText(name, amount){ return `${name} ơi, nốt anh ${NF.format(amount)}đ nhá`; }
function openRemindSheet(mid){
  const m=memberById(mid); if(!m) return;
  const net=pairNet(mid);
  const s=sheetOpen(`
    <div class="sheethead"><div class="h1">Nhắc nợ ${esc(m.name)}</div><button class="x" data-close>✕</button></div>
    <div class="field"><label class="lbl">Tin nhắn (sửa được trước khi gửi)</label>
      <textarea class="in" id="rm-txt">${esc(remindText(m.name, Math.max(net,0)))}</textarea></div>
    <button class="btn" id="rm-copy">📋 Sao chép tin nhắn</button>
    <button class="btn btn-ghost" id="rm-share" style="margin-top:10px">↗ Gửi qua Zalo / Messenger…</button>
    <button class="btn btn-line" id="rm-detail" style="margin-top:10px">＋ Chèn bảng kê chi tiết</button>`);
  s.el.querySelector("[data-close]").onclick=s.close;
  const ta=s.el.querySelector("#rm-txt");
  s.el.querySelector("#rm-copy").onclick=async ()=>{
    try{ await navigator.clipboard.writeText(ta.value); }
    catch(e){ ta.select(); document.execCommand("copy"); }
    toast("Đã sao chép, dán vào Zalo là xong ✓");
  };
  s.el.querySelector("#rm-share").onclick=async ()=>{
    if(navigator.share){ try{ await navigator.share({text:ta.value}); }catch(e){} }
    else toast("Thiết bị không hỗ trợ, dùng nút Sao chép nhé", true);
  };
  s.el.querySelector("#rm-detail").onclick=()=>{
    const lines=memberHistory(mid).filter(h=>!h.pay && h.amt>0).slice(0,8)
      .map(h=>`• ${h.label.replace(/^[^\s]+\s/,"")} (${dmy(h.date)}): ${NF.format(h.amt)}đ`);
    if(!lines.length) return toast("Chưa có khoản nào để kê", true);
    ta.value = ta.value.trim() + "\n\n" + lines.join("\n");
    toast("Đã chèn bảng kê");
  };
}

/* ================= TRANG KHÁC / CÀI ĐẶT ================= */

  const cfg=getCfg();
  const my=me();
  const mems=state.members.slice().sort((a,b)=>(b.is_me?1:0)-(a.is_me?1:0) || a.name.localeCompare(b.name,"vi"));
  return `
    <div class="eyebrow">Cài đặt & dữ liệu</div>
    <h1 class="h1">Khác</h1>

    <div class="card"><div class="eyebrow" style="margin-bottom:4px">Tài khoản</div>
      <div class="row" style="cursor:default"><div class="avatar av-g">🔐</div>
        <div class="rowmain name" style="overflow:hidden;text-overflow:ellipsis">${esc(state.session?.user?.email||"")}</div></div>
      <button class="btn btn-ghost" style="margin-top:10px" onclick="doLogout()">Đăng xuất</button>
    </div>

    <div class="card"><div class="eyebrow" style="margin-bottom:4px">Thành viên</div>
      ${mems.map(m=>`<div class="row" style="cursor:default">
        <div class="avatar" style="${avStyle(m.id)}">${esc(initials(m.name))}</div>
        <span class="name" style="flex:1">${esc(m.name)}${m.is_me?' <span class="sub">(bạn)</span>':""}</span>
        <button class="iconbtn" onclick="editMember('${m.id}')">✎</button>
        ${m.is_me?"":pairNet(m.id)===0
          ?`<button class="iconbtn red" onclick="delMemberFull('${m.id}')" title="Xoá + toàn bộ lịch sử">🗑✓</button>`
          :`<button class="iconbtn red" onclick="delMember('${m.id}')" title="Chưa cân bằng — xoá sẽ bị chặn">🗑</button>`
        }
      </div>`).join("")}
      <button class="btn btn-line" style="margin-top:10px" onclick="addMember()">＋ Thêm thành viên</button>
    </div>

    <div class="card"><div class="eyebrow" style="margin-bottom:4px">Danh mục chi tiêu</div>
      ${state.categories.map(c=>`<div class="row" style="cursor:default">
        <div class="avatar av-g" style="font-size:17px">${esc(c.icon)}</div>
        <span class="name" style="flex:1">${esc(c.name)}</span>
        <button class="iconbtn" onclick="editCategory('${c.id}')">✎</button>
        <button class="iconbtn red" onclick="delCategory('${c.id}')">🗑</button>
      </div>`).join("")}
      <button class="btn btn-line" style="margin-top:10px" onclick="addCategory()">＋ Thêm danh mục</button>
    </div>

    <div class="card"><div class="eyebrow" style="margin-bottom:4px">Nút ghi nhanh</div>
      ${state.quick.length ? state.quick.map(q=>`<button class="row" onclick="openQuickModal('${q.id}')">
          <div class="avatar av-g" style="font-size:17px">${esc(q.icon||"⚡")}</div>
          <div class="rowmain name">${esc(q.label)}<div class="sub">${esc(catById(q.category_id)?.name||"Chưa phân loại")}</div></div>
          <div class="leader"></div>${fmt(q.amount)}</button>`).join("")
        : `<div class="sub" style="padding:8px 0">Tạo nút cho khoản hay chi (trà sữa, gửi xe…) để ghi bằng 1 lần bấm.</div>`}
      <button class="btn btn-line" style="margin-top:10px" onclick="openQuickModal()">＋ Thêm nút ghi nhanh</button>
    </div>

    <div class="card"><div class="eyebrow" style="margin-bottom:4px">Dữ liệu</div>
      <div class="sub" style="padding:6px 0 10px">${state.expenses.length} khoản chi nhóm · ${state.personal.length} chi tiêu cá nhân · ${state.incomes.length} khoản thu · ${state.funds.length} quỹ · ${state.settlements.length} lần trả nợ</div>
      <button class="btn btn-ghost" onclick="exportBackup()">⬇ Tải bản sao lưu (JSON)</button>
      <button class="btn btn-ghost" style="margin-top:10px" onclick="refresh()">⟳ Làm mới dữ liệu</button>
      ${cfg&&!cfg.fromCode?`<button class="btn btn-line" style="margin-top:10px" onclick="resetCfg()">Đổi kết nối Supabase</button>`:""}
    </div>
    <div class="sub" style="text-align:center;padding:6px 0 20px">Sổ Tiền 📒 — dữ liệu nằm trong Supabase của riêng bạn</div>`;

async function editMember(mid){
  const m=memberById(mid); if(!m) return;
  const r=await promptSheet(m.is_me?"Tên của bạn":"Sửa tên thành viên", [{key:"name",label:"Tên",value:m.name}]);
  if(!r||!r.name) return;
  await run(sb.from("members").update({name:r.name}).eq("id", mid));
  await dbLoad(); render(); toast("Đã lưu ✓");
}
async function addMember(){
  const r=await promptSheet("Thêm thành viên",[{key:"name",label:"Tên",placeholder:"VD: Bình"}],"Thêm");
  if(!r||!r.name) return;
  await run(sb.from("members").insert({name:r.name}));
  await dbLoad(); render(); toast(`Đã thêm ${r.name} ✓`);
}
async function delMember(mid){
  const m=memberById(mid);
  const net=pairNet(mid);
  if(net!==0){
    toast(`${m?.name||"Người này"} chưa cân bằng (còn ${fmtPlain(Math.abs(net))}). Hãy ghi nhận trả nợ đủ trước rồi xoá.`, true);
    return;
  }
  if(!(await ask(`Xoá ${m?.name||"thành viên này"} khỏi sổ?`))) return;
  const { error }=await sb.from("members").delete().eq("id", mid);
  if(error){
    toast(error.code==="23503"?"Người này còn giao dịch — dùng nút 🗑✓ để xoá cả lịch sử.":"Lỗi: "+error.message, true);
    return;
  }
  await dbLoad(); render(); toast("Đã xoá");
}

async function delMemberFull(mid){
  const m=memberById(mid);
  const net=pairNet(mid);
  const name=m?.name||"thành viên này";
  let msg = net!==0
    ? `${name} CHƯA cân bằng (còn ${fmtPlain(Math.abs(net))}).\n\nBạn chắc chắn muốn xoá và xoá TOÀN BỘ lịch sử?`
    : `Xoá ${name} và toàn bộ lịch sử giao dịch của họ trong mọi nhóm?\n\nHành động này không thể hoàn tác.`;
  if(!(await ask(msg,"Xoá tất cả"))) return;
  try{
    /* Xoá đúng thứ tự để không bị FK violation */
    // 1. Tìm các expense mà member là payer
    const payerExpIds=state.expenses.filter(e=>e.payer_id===mid).map(e=>e.id);
    // 2. Xoá splits của member này
    await run(sb.from("expense_splits").delete().eq("member_id",mid));
    // 3. Nếu member là payer: xoá personal liên kết, splits người khác, rồi expense
    for(const eid of payerExpIds){
      await run(sb.from("personal_expenses").delete().eq("source_expense_id",eid));
      await run(sb.from("expense_splits").delete().eq("expense_id",eid));
      await run(sb.from("expenses").delete().eq("id",eid));
    }
    // 4. Xoá settlements
    await run(sb.from("settlements").delete().eq("member_id",mid));
    // 5. Xoá group_members
    await run(sb.from("group_members").delete().eq("member_id",mid));
    // 6. Xoá member
    await run(sb.from("members").delete().eq("id",mid));
    await dbLoad(); render();
    toast(`Đã xoá ${name} và toàn bộ lịch sử ✓`);
  }catch(e){ toast("Lỗi khi xoá: "+e.message,true); }
}
async function editCategory(cid){
  const c=catById(cid); if(!c) return;
  const r=await promptSheet("Sửa danh mục",[
    {key:"icon",label:"Biểu tượng (emoji)",value:c.icon,max:4},
    {key:"name",label:"Tên danh mục",value:c.name}]);
  if(!r||!r.name) return;
  await run(sb.from("categories").update({name:r.name, icon:r.icon||"🏷️"}).eq("id", cid));
  await dbLoad(); render(); toast("Đã lưu ✓");
}
async function addCategory(){
  const r=await promptSheet("Thêm danh mục",[
    {key:"icon",label:"Biểu tượng (emoji)",placeholder:"VD: 🐶",max:4},
    {key:"name",label:"Tên danh mục",placeholder:"VD: Thú cưng"}],"Thêm");
  if(!r||!r.name) return;
  const maxSort=Math.max(0,...state.categories.map(c=>c.sort||0));
  await run(sb.from("categories").insert({name:r.name, icon:r.icon||"🏷️", sort:maxSort+1}));
  await dbLoad(); render(); toast("Đã thêm ✓");
}
async function delCategory(cid){
  const c=catById(cid);
  if(!(await ask(`Xoá danh mục "${c?.name}"? Các khoản chi cũ sẽ chuyển thành "Chưa phân loại".`))) return;
  await run(sb.from("categories").delete().eq("id", cid));
  await dbLoad(); render(); toast("Đã xoá");
}
function exportBackup(){
  const data={ app:"So Tien", exported_at:new Date().toISOString(),
    members:state.members, groups:state.groups, group_members:state.groupMembers,
    expenses:state.expenses, expense_splits:state.splits, settlements:state.settlements,
    categories:state.categories, personal_expenses:state.personal,
    incomes:state.incomes, budgets:state.budgets, quick_items:state.quick,
    funds:state.funds, fund_txns:state.fundTxns };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`sotien-backup-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Đã tải bản sao lưu ✓");
}

/* ================= KHỞI ĐỘNG ================= */
boot();
</script>
