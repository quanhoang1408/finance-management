/* ================= VIỆC CẦN LÀM ================= */
const ST_META={
  todo:   {ic:"☐", label:"Cần làm",  bg:"var(--paper)",      fg:"var(--muted)"},
  doing:  {ic:"◐", label:"Đang làm", bg:"#F4EDDC",           fg:"var(--amber)"},
  done:   {ic:"✓", label:"Xong",     bg:"var(--green-soft)", fg:"var(--green)"},
  cancel: {ic:"✕", label:"Đã huỷ",   bg:"var(--red-soft)",   fg:"var(--red)"}
};
const ST_ORDER=["todo","doing","done","cancel"];

/* Việc chưa xong của hôm trước tự dời sang hôm nay */
async function rollTasks(){
  const t=todayStr();
  try{
    const { error }=await sb.from("tasks").update({due_date:t})
      .lt("due_date", t).in("status", ["todo","doing"]);
    if(error) throw error;
  }catch(e){}
}
function lateDays(tk){
  if(!tk.origin_date || tk.origin_date>=tk.due_date) return 0;
  return Math.round((new Date(tk.due_date+"T12:00:00") - new Date(tk.origin_date+"T12:00:00"))/86400000);
}
function doneDate(tk){ return tk.done_at ? tk.done_at.slice(0,10) : tk.due_date; }

async function cycleStatus(id){
  const tk=state.tasks.find(x=>x.id===id); if(!tk) return;
  const next = tk.status==="todo" ? "doing" : tk.status==="doing" ? "done" : "todo";
  const pp={ status:next, done_at: next==="done" ? new Date().toISOString() : null };
  if(next==="done") pp.due_date=todayStr();
  tk.status=next; tk.done_at=pp.done_at;   /* cập nhật ngay cho mượt */
  render();
  try{ await run(sb.from("tasks").update(pp).eq("id", id)); await dbLoad(); render(); }
  catch(e){ await dbLoad(); render(); }
}
async function quickAddTask(){
  const inp=$("#tk-new"); if(!inp) return;
  const title=inp.value.trim(); if(!title) return;
  inp.value="";
  try{
    await run(sb.from("tasks").insert({title, due_date:todayStr(), origin_date:todayStr()}));
    await dbLoad(); render();
    setTimeout(()=>$("#tk-new")?.focus(), 50);
  }catch(e){}
}

function taskRow(tk, showLate){
  const m=ST_META[tk.status]||ST_META.todo;
  const late=showLate?lateDays(tk):0;
  const strike = (tk.status==="done"||tk.status==="cancel") ? "text-decoration:line-through;opacity:.6" : "";
  return `<div class="sprow" style="gap:11px">
    <button class="iconbtn" style="background:${m.bg};color:${m.fg};font-size:16px" onclick="cycleStatus('${tk.id}')">${m.ic}</button>
    <button class="rowmain name" style="flex:1;min-width:0;text-align:left;border:0;background:none;cursor:pointer;padding:0;font-size:15px"
      onclick="openTaskModal('${tk.id}')">
      <span style="${strike}">${esc(tk.title)}</span>
      ${(late>0||tk.note)?`<div class="sub">${late>0?`<span style="color:var(--red)">⏱ trễ ${late} ngày</span>${tk.note?" · ":""}`:""}${tk.note?esc(tk.note):""}</div>`:""}
    </button>
  </div>`;
}

function viewTasks(){
  const t=todayStr();
  const doing=state.tasks.filter(x=>x.status==="doing" && x.due_date<=t);
  const todo =state.tasks.filter(x=>x.status==="todo"  && x.due_date<=t);
  const doneToday=state.tasks.filter(x=>(x.status==="done"||x.status==="cancel") && doneDate(x)===t);
  const later=state.tasks.filter(x=>(x.status==="todo"||x.status==="doing") && x.due_date>t)
    .sort((a,b)=>a.due_date.localeCompare(b.due_date));
  const left=doing.length+todo.length;

  const block=(title,arr,late)=>arr.length?`<div class="card">
    <div class="eyebrow" style="margin-bottom:2px">${title}</div>${arr.map(x=>taskRow(x,late)).join("")}</div>`:"";

  return `
    <div class="card" style="background:var(--ink);color:#fff">
      <div class="eyebrow" style="color:rgba(255,255,255,.65)">${WD_LONG[wdOf(t)]} · ${dmy(t)}</div>
      <div class="money big">${left}<span class="d" style="font-size:.5em"> việc cần làm</span></div>
      ${doneToday.length?`<div style="margin-top:6px;font-size:13.5px;font-weight:600;color:#7FD3A8">Đã xong hôm nay: ${doneToday.filter(x=>x.status==="done").length}</div>`:""}
    </div>
    <div class="card" style="padding:12px 14px">
      <div style="display:flex;gap:8px">
        <input class="in" id="tk-new" placeholder="Thêm việc cho hôm nay…" style="flex:1"
          onkeydown="if(event.key==='Enter')quickAddTask()">
        <button class="btn btn-sm" style="width:auto;padding:0 16px" onclick="quickAddTask()">＋</button>
      </div>
    </div>
    ${block("Đang làm", doing, true)}
    ${block("Cần làm", todo, true)}
    ${block("Đã xong hôm nay", doneToday, false)}
    ${later.length?`<div class="card"><div class="eyebrow" style="margin-bottom:2px">Sắp tới</div>
      ${later.slice(0,8).map(x=>`<div class="sprow" style="gap:11px">
        <button class="iconbtn" style="background:var(--paper);color:var(--muted);font-size:16px" onclick="cycleStatus('${x.id}')">☐</button>
        <button class="rowmain name" style="flex:1;min-width:0;text-align:left;border:0;background:none;cursor:pointer;padding:0;font-size:15px" onclick="openTaskModal('${x.id}')">
          ${esc(x.title)}<div class="sub">${dmy(x.due_date)}</div></button>
      </div>`).join("")}</div>`:""}
    ${(left||doneToday.length||later.length)?"":`<div class="card"><div class="empty"><span class="big-ic">🗒️</span>Hôm nay chưa có việc nào.<br>Gõ vào ô trên để thêm nhanh.</div></div>`}
    <button class="btn btn-line" onclick="openTaskModal()">＋ Thêm việc chi tiết (chọn ngày, ghi chú)</button>`;
}

function openTaskModal(id){
  const tk = id ? state.tasks.find(x=>x.id===id) : null;
  let st = tk?.status || "todo";
  const s=sheetOpen(`
    <div class="sheethead"><div class="h1">${tk?"Sửa việc":"Việc mới"}</div><button class="x" data-close>✕</button></div>
    <div class="field"><label class="lbl">Việc gì?</label>
      <input class="in" id="tk-title" placeholder="VD: Gửi báo giá cho khách A" value="${esc(tk?.title||"")}"></div>
    <div class="field"><label class="lbl">Trạng thái</label>
      <div class="chips" id="tk-st">${ST_ORDER.map(k=>`
        <button class="chip ${k===st?"on":""}" data-s="${k}">${ST_META[k].ic} ${ST_META[k].label}</button>`).join("")}</div></div>
    <div class="field"><label class="lbl">Ngày</label>
      <input class="in" id="tk-date" type="date" value="${tk?tk.due_date:todayStr()}"></div>
    <div class="field"><label class="lbl">Ghi chú (không bắt buộc)</label>
      <input class="in" id="tk-note" placeholder="VD: cần sếp duyệt trước" value="${esc(tk?.note||"")}"></div>
    ${tk&&lateDays(tk)>0?`<div class="note" style="margin:0 0 12px">⏱ Việc này tạo ngày ${dmyFull(tk.origin_date)}, đã dời ${lateDays(tk)} ngày.</div>`:""}
    <button class="btn" id="tk-save">${tk?"Lưu thay đổi":"Thêm việc"}</button>
    ${tk?`<button class="btn btn-danger" id="tk-del" style="margin-top:10px">Xoá việc này</button>`:""}`);
  const el=x=>s.el.querySelector(x);
  el("[data-close]").onclick=s.close;
  s.el.querySelectorAll("#tk-st .chip").forEach(b=>b.onclick=()=>{
    st=b.dataset.s; s.el.querySelectorAll("#tk-st .chip").forEach(x=>x.classList.toggle("on",x===b));
  });
  setTimeout(()=>{ if(!tk) el("#tk-title").focus(); }, 60);
  el("#tk-save").onclick=async ()=>{
    const title=el("#tk-title").value.trim();
    if(!title) return toast("Ghi tên việc đã nhé", true);
    const btn=el("#tk-save"); btn.disabled=true;
    try{
      const date=el("#tk-date").value||todayStr();
      const pp={ title, status:st, note:el("#tk-note").value.trim()||null, due_date:date,
        done_at: (st==="done"||st==="cancel") ? (tk?.done_at || new Date().toISOString()) : null };
      if(tk) await run(sb.from("tasks").update(pp).eq("id", tk.id));
      else await run(sb.from("tasks").insert({...pp, origin_date:date}));
      await dbLoad(); closeAllSheets(); render(); toast(tk?"Đã lưu ✓":"Đã thêm việc ✓");
    }catch(e){ btn.disabled=false; }
  };
  const del=el("#tk-del");
  if(del) del.onclick=async ()=>{
    if(!(await ask("Xoá việc này khỏi sổ?"))) return;
    await run(sb.from("tasks").delete().eq("id", tk.id));
    await dbLoad(); closeAllSheets(); render(); toast("Đã xoá");
  };
}

/* ---------- Lịch sử tuần (để khai task công ty) ---------- */
function weekTaskData(){
  const ws=weekStart();
  const days=Array.from({length:7},(_,i)=>addDays(ws,i));
  return days.map(ds=>({
    ds,
    items: state.tasks.filter(x=>(x.status==="done"||x.status==="cancel") && doneDate(x)===ds)
  }));
}
function viewTaskHistory(){
  const ws=weekStart();
  const data=weekTaskData();
  const totalDone=data.reduce((a,d)=>a+d.items.filter(x=>x.status==="done").length,0);
  const totalCancel=data.reduce((a,d)=>a+d.items.filter(x=>x.status==="cancel").length,0);
  const inThisWeek=data.some(d=>d.ds===todayStr());

  let body="";
  for(const d of data){
    if(!d.items.length) continue;
    body+=`<div class="dayhead">${WD_LONG[wdOf(d.ds)]} · ${dmy(d.ds)}</div>
      <div class="card" style="padding:6px 16px">${d.items.map(x=>{
        const m=ST_META[x.status];
        return `<div class="sprow" style="gap:10px">
          <span style="color:${m.fg};font-weight:800">${m.ic}</span>
          <button class="rowmain name" style="flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;font-size:14.5px;cursor:pointer"
            onclick="openTaskModal('${x.id}')">${esc(x.title)}
            ${x.note?`<div class="sub">${esc(x.note)}</div>`:""}</button>
        </div>`;}).join("")}</div>`;
  }

  return `
    <div class="monthnav">
      <button class="mbtn" onclick="changeWeek(-1)">‹</button>
      <h1 class="h1" style="font-size:19px">${dmy(ws)} – ${dmy(addDays(ws,6))}</h1>
      <button class="mbtn" onclick="changeWeek(1)">›</button>
    </div>
    ${!inThisWeek?`<button class="btn btn-ghost" style="margin-bottom:14px" onclick="thisWeek()">↩ Về tuần này</button>`:""}
    <div class="card" style="background:var(--ink);color:#fff">
      <div class="eyebrow" style="color:rgba(255,255,255,.65)">Đã hoàn thành trong tuần</div>
      <div class="money big">${totalDone}<span class="d" style="font-size:.5em"> việc</span></div>
      ${totalCancel?`<div style="margin-top:6px;font-size:13px;color:#FFB4A0">${totalCancel} việc đã huỷ</div>`:""}
    </div>
    ${totalDone+totalCancel?`<button class="btn" onclick="copyWeekTasks()">📋 Sao chép cả tuần để khai task</button>`:""}
    ${body||`<div class="card"><div class="empty"><span class="big-ic">📭</span>Tuần này chưa có việc nào hoàn thành.</div></div>`}`;
}
async function copyWeekTasks(){
  const data=weekTaskData();
  const lines=[];
  for(const d of data){
    const done=d.items.filter(x=>x.status==="done");
    if(!done.length) continue;
    lines.push(`${WD_LONG[wdOf(d.ds)]} ${dmy(d.ds)}`);
    for(const x of done) lines.push(`• ${x.title}${x.note?` (${x.note})`:""}`);
    lines.push("");
  }
  const text=lines.join("\n").trim();
  if(!text) return toast("Tuần này chưa có việc nào xong", true);
  try{ await navigator.clipboard.writeText(text); toast("Đã sao chép, dán vào form khai task ✓"); }
  catch(e){
    const ta=document.createElement("textarea");
    ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    toast("Đã sao chép ✓");
  }
}

async function editMember(mid){
  const m=memberById(mid); if(!m) return;
  const r=await promptSheet(m.is_me?"Tên của bạn":"Sửa tên thành viên", [{key:"name",label:"Tên",value:m.name}]);
  if(!r||!r.name) return;
  await run(sb.from("members").update({name:r.name}).eq("id", mid));
  await dbLoad(); render(); toast("Đã lưu ✓");
}
async function addMember(){
  const r=await promptSheet("Thêm thành viên",[{key:"name",label:"Tên",placeholder:"VD: Bình"}],"Thêm");
  if(!r||!r.name) return;
  await run(sb.from("members").insert({name:r.name}));
  await dbLoad(); render(); toast(`Đã thêm ${r.name} ✓`);
}
function memberTxnCount(mid){
  const my=me();
  let n=0;
  for(const e of state.expenses){
    if(e.payer_id===mid){ n++; continue; }
    if(e.payer_id===my.id && state.splits.some(x=>x.expense_id===e.id && x.member_id===mid)) n++;
  }
  n+=state.settlements.filter(x=>x.member_id===mid).length;
  return n;
}
function openDeleteMember(mid){
  const m=memberById(mid); if(!m) return;
  const net=pairNet(mid);
  const cnt=memberTxnCount(mid);
  const grs=state.groups.filter(g=>state.groupMembers.some(gm=>gm.group_id===g.id&&gm.member_id===mid));
  const s=sheetOpen(`
    <div class="sheethead">
      <div style="display:flex;align-items:center;gap:11px">
        <div class="avatar" style="${avStyle(mid)};width:44px;height:44px;font-size:18px">${esc(initials(m.name))}</div>
        <div><div style="font-weight:800;font-size:18px">${esc(m.name)}</div>
        <div class="sub">${cnt} giao dịch · ${grs.length} nhóm</div></div>
      </div><button class="x" data-close>✕</button>
    </div>
    ${net!==0?`<div class="errbox">Chưa cân bằng: ${net>0?"còn nợ bạn":"bạn còn nợ họ"} <b>${fmtPlain(Math.abs(net))}</b>. Xoá bây giờ sẽ mất khoản này khỏi sổ.</div>`
             :`<div class="note" style="margin:0 0 12px">✓ Đã cân bằng, xoá thoải mái.</div>`}
    ${cnt?`<div class="note" style="margin:0 0 14px">Xoá sẽ gỡ luôn <b>${cnt} giao dịch</b> của ${esc(m.name)}: các khoản chi họ đứng ra trả, phần chia của họ trong khoản chi của bạn, và lịch sử trả nợ. Không hoàn tác được.</div>`:""}
    <button class="btn btn-danger" id="dm-go">🗑 Xoá ${esc(m.name)} và toàn bộ lịch sử</button>
    <button class="btn btn-ghost" id="dm-no" style="margin-top:10px">Huỷ</button>`);
  s.el.querySelector("[data-close]").onclick=s.close;
  s.el.querySelector("#dm-no").onclick=s.close;
  s.el.querySelector("#dm-go").onclick=async ()=>{
    const btn=s.el.querySelector("#dm-go");
    btn.disabled=true; btn.textContent="Đang xoá…";
    try{
      const payerExpIds=state.expenses.filter(e=>e.payer_id===mid).map(e=>e.id);
      await run(sb.from("expense_splits").delete().eq("member_id",mid));
      for(const eid of payerExpIds){
        await run(sb.from("personal_expenses").delete().eq("source_expense_id",eid));
        await run(sb.from("expense_splits").delete().eq("expense_id",eid));
        await run(sb.from("expenses").delete().eq("id",eid));
      }
      await run(sb.from("settlements").delete().eq("member_id",mid));
      await run(sb.from("group_members").delete().eq("member_id",mid));
      await run(sb.from("members").delete().eq("id",mid));
      await dbLoad(); closeAllSheets(); render();
      toast(`Đã xoá ${m.name} và toàn bộ lịch sử ✓`);
    }catch(e){
      btn.disabled=false; btn.textContent="🗑 Thử lại";
      toast("Lỗi khi xoá: "+(e.message||e), true);
    }
  };
}
async function editCategory(cid){
  const c=catById(cid); if(!c) return;
  const r=await promptSheet("Sửa danh mục",[
    {key:"icon",label:"Biểu tượng (emoji)",value:c.icon,max:4},
    {key:"name",label:"Tên danh mục",value:c.name}]);
  if(!r||!r.name) return;
  await run(sb.from("categories").update({name:r.name, icon:r.icon||"🏷️"}).eq("id", cid));
  await dbLoad(); render(); toast("Đã lưu ✓");
}
async function addCategory(){
  const r=await promptSheet("Thêm danh mục",[
    {key:"icon",label:"Biểu tượng (emoji)",placeholder:"VD: 🐶",max:4},
    {key:"name",label:"Tên danh mục",placeholder:"VD: Thú cưng"}],"Thêm");
  if(!r||!r.name) return;
  const maxSort=Math.max(0,...state.categories.map(c=>c.sort||0));
  await run(sb.from("categories").insert({name:r.name, icon:r.icon||"🏷️", sort:maxSort+1}));
  await dbLoad(); render(); toast("Đã thêm ✓");
}
async function delCategory(cid){
  const c=catById(cid);
  if(!(await ask(`Xoá danh mục "${c?.name}"? Các khoản chi cũ sẽ chuyển thành "Chưa phân loại".`))) return;
  await run(sb.from("categories").delete().eq("id", cid));
  await dbLoad(); render(); toast("Đã xoá");
}
function exportBackup(){
  const data={ app:"So Tien", exported_at:new Date().toISOString(),
    members:state.members, groups:state.groups, group_members:state.groupMembers,
    expenses:state.expenses, expense_splits:state.splits, settlements:state.settlements,
    categories:state.categories, personal_expenses:state.personal,
    incomes:state.incomes, budgets:state.budgets, quick_items:state.quick,
    funds:state.funds, fund_txns:state.fundTxns,
    schedule_items:state.schedule, schedule_skips:state.skips, tasks:state.tasks };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`sotien-backup-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Đã tải bản sao lưu ✓");
}

/* ================= KHỞI ĐỘNG ================= */
boot();
</script>
